name: Build Native Linux Packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.0.1)'
        required: true
        default: 'v0.0.1'

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository with submodules
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # 2. Setup pnpm
      - uses: pnpm/action-setup@v4
        with:
          version: 9.3.0

      # 3. Setup Node.js
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 4. Install build dependencies (including libarchive-tools instead of bsdtar)
      - name: Install Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential libsecret-1-dev fakeroot dpkg-dev libarchive-tools

      # 5. Install project dependencies
      - name: Install Project Dependencies
        working-directory: ${{ github.workspace }}
        run: pnpm install --no-frozen-lockfile

      # 6. Build Renderer
      - name: Build Renderer
        working-directory: ${{ github.workspace }}
        run: pnpm run --prefix xmcl-keystone-ui build

      # 7. Build Electron App (DEB, AppImage, Pacman) WITHOUT icon generation
      - name: Build Electron App
        working-directory: ${{ github.workspace }}
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          NODE_OPTIONS: --max-old-space-size=32768
          NODE_ENV: production
          CSC_IDENTITY_AUTO_DISCOVERY: false
          RELEASE: true
        run: |
          # Build directly, skip icons
          pnpm run --prefix xmcl-electron-app build -- --linux deb appimage pacman --x64 --arm64

      # 8. Copy all build artifacts to workspace
      - name: Copy Build Artifacts
        run: |
          mkdir -p ${{ github.workspace }}/dist
          cp ${{ github.workspace }}/xmcl-electron-app/build/output/*.{deb,AppImage,pacman,tar.xz,rpm} ${{ github.workspace }}/dist/ || true

      # 9. Upload artifacts to GitHub Actions
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: dist/*

      # 10. Create Draft GitHub Release
      - name: Create Draft Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ inputs.version }}
          name: Release ${{ inputs.version }}
          draft: true
          prerelease: true
          files: |
            dist/*
