name: Build Native Linux DEB

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.0.1)'
        required: true
        default: 'v0.0.1'

jobs:
  build-linux-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v4
        with:
          version: 9.3.0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential libsecret-1-dev fakeroot dpkg-dev

      - name: Install Project Dependencies
        working-directory: ${{ github.workspace }}
        run: pnpm install --no-frozen-lockfile

      - name: Build Renderer
        working-directory: ${{ github.workspace }}
        run: pnpm run --prefix xmcl-keystone-ui build

      - name: Build Electron App (DEB)
        working-directory: ${{ github.workspace }}
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          NODE_OPTIONS: --max-old-space-size=32768
          NODE_ENV: production
          CSC_IDENTITY_AUTO_DISCOVERY: false
          RELEASE: true
        run: |
          pnpm run --prefix xmcl-electron-app generate:icons
          pnpm run --prefix xmcl-electron-app build -- --linux deb --x64

      - name: Copy DEB Artifacts to Workspace
        run: |
          mkdir -p ${{ github.workspace }}/dist
          cp ${{ github.workspace }}/xmcl-electron-app/build/output/*.deb ${{ github.workspace }}/dist/ || true

      - name: Upload DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb-build
          path: dist/*.deb

      - name: Create Draft Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ inputs.version }}
          name: Release ${{ inputs.version }}
          draft: true
          prerelease: true
          files: |
            dist/*.deb
